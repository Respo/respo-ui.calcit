name: Upload

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: cos-upload-${{ github.repository }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: false
  queue: max

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          yarn --version

      - uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f # v1.5.0
        with:
          tools: calcit,caps
          deps-file: deps.cirru

      - name: Validate and compile
        run: |
          set -euo pipefail
          caps --strict --ci
          yarn install --immutable
          caps deps.cirru verify --toolchain
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          node scripts/gen-components-doc.mjs
          git diff --exit-code -- docs/components.md
          calcit calcit.cirru --check-only --all-defs
          calcit fix --workflow strict --verify --format json | jq -e 'if .data.workflow.status == "passed" and .diagnostics == [] then true else ., false end'
          calcit calcit.cirru test --exclude-tag js-only --require-match --summary-only --format json
          yarn test:js
          calcit calcit.cirru --check-only --ns 'respo-ui.$meta' --ns respo-ui.comp --ns respo-ui.comp.component-docs --ns respo-ui.comp.component-page --ns respo-ui.comp.components --ns respo-ui.comp.container --ns respo-ui.comp.design-page --ns respo-ui.comp.docs --ns respo-ui.comp.fonts-page --ns respo-ui.comp.home --ns respo-ui.comp.layouts-page --ns respo-ui.comp.sidebar --ns respo-ui.comp.widgets-page --ns respo-ui.config --ns respo-ui.core --ns respo-ui.css --ns respo-ui.main --ns respo-ui.router --ns respo-ui.schema --ns respo-ui.tokens --ns respo-ui.util --summary-only --format json
          calcit calcit.cirru analyze check-examples --ns respo-ui.schema
          calcit calcit.cirru analyze check-examples --ns respo-ui.comp --js
          calcit calcit.cirru analyze weak-types --only dynamic-method --format json | jq -e '.data.summary.findings == 0'
          calcit docs check-md README.md --dep ./ --failures-only
          calcit calcit.cirru js

      - name: Check out released Message consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Respo/respo-message.calcit
          ref: 0.0.37
          path: .calcit/message-consumer
          persist-credentials: false

      - name: Check Message against this UI candidate
        working-directory: .calcit/message-consumer
        run: |
          set -euo pipefail
          # Candidate compatibility test, not the consumer's published dependency graph.
          # Only this fresh checkout's metadata/module view changes; Snapshot source stays untouched.
          git rev-parse HEAD
          # Explicitly migrate this disposable fixture's toolchain metadata; do not
          # bypass strict preflight or claim the original alpha release was paired.
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          manifest.dependencies['@calcit/procs'] = '0.30.1';
          writeFileSync('package.json', JSON.stringify(manifest, null, 2) + '\n');
          const deps = readFileSync('deps.cirru', 'utf8')
            .replace('|0.30.1-alpha.4', '|0.30.1')
            .replace('|0.7.41', '|0.8.0')
            .replace('|0.16.122', '|0.16.124')
            .replace('|0.2.3', '|0.2.5');
          writeFileSync('deps.cirru', deps);
          NODE
          yarn install
          yarn install --immutable
          mkdir -p .calcit/modules
          for module in respo.calcit respo-router.calcit js-ffi; do
            ln -s "$GITHUB_WORKSPACE/.calcit/modules/$module" ".calcit/modules/$module"
          done
          ln -s "$GITHUB_WORKSPACE" .calcit/modules/respo-ui.calcit
          calcit calcit.cirru --check-only --all-defs
          calcit fix --workflow strict --verify --format json | jq -e 'if .data.workflow.status == "passed" and .diagnostics == [] then true else ., false end'
          calcit calcit.cirru test --tag unit --require-match --summary-only --format json
          calcit calcit.cirru js
          git diff --quiet -- . ':!deps.cirru' ':!package.json' ':!yarn.lock'

      - name: Select CDN asset prefix
        id: asset-path
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            asset_prefix="${GITHUB_REPOSITORY}/pr/${PR_NUMBER}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            asset_prefix="${GITHUB_REPOSITORY}/"
          else
            asset_prefix="${GITHUB_REPOSITORY}/branches/${GITHUB_REF_NAME}/"
          fi
          base_url="https://cos-sh.tiye.me/${asset_prefix}"
          echo "prefix=${asset_prefix}" >> "$GITHUB_OUTPUT"
          echo "base-url=${base_url}" >> "$GITHUB_OUTPUT"
          echo "VITE_BASE_URL=${base_url}" >> "$GITHUB_ENV"

      - name: Build demo
        run: yarn vite build

      - name: Upload static assets to COS
        if: steps.asset-path.outcome == 'success'
        uses: worktools/cos-upload-action@06d6027dcca6413c5936e04a9b6e9f0d5ef71ba0 # v1.2.0
        with:
          source-dir: dist
          bucket: ${{ secrets.COS_BUCKET }}
          region: ap-shanghai
          prefix: ${{ steps.asset-path.outputs.prefix }}
          secret-id: ${{ secrets.COS_SECRET_ID }}
          secret-key: ${{ secrets.COS_SECRET_KEY }}
          public-base-url: ${{ steps.asset-path.outputs.base-url }}

      - name: Deploy to server
        id: deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: Pendect/action-rsyncer@8e05ffa5c93e5d9c9b167796b26044d2c616b2b9 # v2.0.0
        env:
          DEPLOY_KEY: ${{secrets.rsync_private_key}}
        with:
          flags: "-avzr --progress"
          options: ""
          ssh_options: ""
          src: "dist/*"
          dest: "rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}"

      - name: Display status from deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ steps.deploy.outputs.status }}"
