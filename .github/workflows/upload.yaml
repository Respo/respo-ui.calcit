name: Upload

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: cos-upload-${{ github.repository }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: false
  queue: max

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          yarn --version

      - uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f # v1.5.0
        with:
          tools: calcit,caps

      - name: Validate and compile
        run: |
          set -euo pipefail
          caps --strict --ci
          yarn install --immutable
          caps deps.cirru verify --toolchain
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --check-only
          calcit calcit.cirru test --require-match --summary-only --format json
          yarn test:js
          calcit calcit.cirru analyze check-public --ns 'respo-ui.$meta' --ns respo-ui.comp --ns respo-ui.comp.components --ns respo-ui.comp.container --ns respo-ui.comp.docs --ns respo-ui.comp.fonts-page --ns respo-ui.comp.home --ns respo-ui.comp.layouts-page --ns respo-ui.comp.sidebar --ns respo-ui.comp.widgets-page --ns respo-ui.config --ns respo-ui.core --ns respo-ui.css --ns respo-ui.main --ns respo-ui.router --ns respo-ui.schema --ns respo-ui.util --summary-only --format json
          calcit calcit.cirru analyze check-examples --ns respo-ui.schema
          calcit calcit.cirru analyze check-examples --ns respo-ui.comp --js
          mkdir -p .calcit
          calcit calcit.cirru analyze check-types --summary-only --format json > .calcit/check-types.json
          calcit calcit.cirru analyze weak-types --only schema-dynamic,code-dynamic,code-nil --intent unresolved,declared-optional --summary-only --format json > .calcit/weak-types.json
          calcit calcit.cirru analyze deprecated --summary-only --format json > .calcit/deprecated.json
          node scripts/check-calcit-upgrade-baseline.mjs
          calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru
          calcit calcit.cirru analyze dynamic-methods --format json | jq -e '.data.summary.findings == 0'
          calcit docs check-md README.md --dep ./ --failures-only
          calcit calcit.cirru js

      - name: Select CDN asset prefix
        id: asset-path
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            asset_prefix="${GITHUB_REPOSITORY}/pr/${PR_NUMBER}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            asset_prefix="${GITHUB_REPOSITORY}/"
          else
            asset_prefix="${GITHUB_REPOSITORY}/branches/${GITHUB_REF_NAME}/"
          fi
          base_url="https://cos-sh.tiye.me/${asset_prefix}"
          echo "prefix=${asset_prefix}" >> "$GITHUB_OUTPUT"
          echo "base-url=${base_url}" >> "$GITHUB_OUTPUT"
          echo "VITE_BASE_URL=${base_url}" >> "$GITHUB_ENV"

      - name: Build demo
        run: yarn vite build

      - name: Upload static assets to COS
        if: steps.asset-path.outcome == 'success'
        uses: worktools/cos-upload-action@06d6027dcca6413c5936e04a9b6e9f0d5ef71ba0 # v1.2.0
        with:
          source-dir: dist
          bucket: ${{ secrets.COS_BUCKET }}
          region: ap-shanghai
          prefix: ${{ steps.asset-path.outputs.prefix }}
          secret-id: ${{ secrets.COS_SECRET_ID }}
          secret-key: ${{ secrets.COS_SECRET_KEY }}
          public-base-url: ${{ steps.asset-path.outputs.base-url }}

      - name: Deploy to server
        id: deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: Pendect/action-rsyncer@8e05ffa5c93e5d9c9b167796b26044d2c616b2b9 # v2.0.0
        env:
          DEPLOY_KEY: ${{secrets.rsync_private_key}}
        with:
          flags: "-avzr --progress"
          options: ""
          ssh_options: ""
          src: "dist/*"
          dest: "rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}"

      - name: Display status from deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ steps.deploy.outputs.status }}"
